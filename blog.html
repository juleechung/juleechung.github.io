---
layout: default
title: Research Journal
---

<section class="journal-intro">
  <h1>Research Journal</h1>
  <p>Weekly notes from my DREAM research project on multimodal human-robot interaction.</p>
</section>

<div class="journal-list">
  {% assign journal_posts = site.posts | reverse %}
  {% for post in journal_posts %}
    <article class="journal-entry">
      <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
